<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>يومياتي - ليالي الصحراء</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--sand:#FDF6E3;--sand2:#FEF3C7;--dune:#D97706;--dune2:#92400E;--night:#1C1917;--oasis:#10B981;--fail:#DC2626;--muted:#78716C;--card:#FFFFFF;--border:#FDE68A;--shadow:0 18px 40px rgba(146,64,14,.12);--radius:20px}
html.dark{--sand:#1C1917;--sand2:#292524;--card:#292524;--night:#FDF6E3;--muted:#A8A29E;--border:#44403C;--shadow:0 18px 40px rgba(0,0,0,.4)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:'Tajawal',sans-serif;background:var(--sand);color:var(--night);overflow-x:hidden;transition:.3s}
.desert-bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(800px 400px at 20% 0%, #FDE68A 0%, transparent 60%),radial-gradient(600px 300px at 90% 10%, #FDBA74 0%, transparent 60%),linear-gradient(180deg, var(--sand) 0%, var(--sand2) 100%)}
html.dark .desert-bg{background:radial-gradient(800px 400px at 20% 0%, #44403C 0%, transparent 60%),linear-gradient(180deg, #1C1917 0%, #292524 100%)}
.dune{position:absolute;left:-10%;right:-10%;height:220px;opacity:.08;border-radius:50% 50% 0 0;transition:transform .15s linear}
.dune1{bottom:-80px;background:var(--dune);transform:scaleX(1.2)} .dune2{bottom:-120px;background:var(--dune2);opacity:.06;transform:scaleX(1.4)}
.stars{position:absolute;inset:0;opacity:0;transition:.3s} html.dark .stars{opacity:1}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;box-shadow:0 0 6px #fff;animation:tw 3s infinite alternate}
@keyframes tw{0%{opacity:.3}100%{opacity:1}}
#cursorGlow{position:fixed;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle, rgba(217,119,6,.16) 0%, transparent 70%);pointer-events:none;z-index:999;transform:translate(-50%,-50%);opacity:0;transition:opacity .3s}
.container{max-width:580px;margin:0 auto;padding:0 14px 50px}
.hero{padding:22px 14px 18px;text-align:center}
.hero h1{font-family:'Amiri',serif;font-size:34px;margin:0;color:var(--dune2)} html.dark .hero h1{color:#FDBA74}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px;position:relative;overflow:hidden;transition:transform .2s, box-shadow .2s}
.card:hover{box-shadow:0 22px 50px rgba(146,64,14,.16)}
.btn{border:none;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;font-family:inherit;position:relative;overflow:hidden;transition:transform .12s, filter .12s;touch-action:manipulation;user-select:none}
.btn:active{transform:scale(.96)} .btn:hover{filter:brightness(1.07)}
.btn-primary{background:linear-gradient(135deg, var(--dune), var(--dune2));color:#fff;box-shadow:0 8px 20px rgba(146,64,14,.3)}
.btn-ghost{background:var(--sand2);border:1px solid var(--border);color:var(--night)} html.dark .btn-ghost{background:#3a3632;color:#fff}
.btn-small{padding:10px 14px;font-size:13px;min-height:44px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s linear;pointer-events:none}
@keyframes ripple{to{transform:scale(4);opacity:0}}
.input{width:100%;padding:13px 14px;border:1.8px solid var(--border);border-radius:14px;background:var(--card);color:var(--night);font-family:inherit;outline:none;font-size:16px;transition:.2s}
.input:focus{border-color:var(--dune);box-shadow:0 0 0 3px rgba(217,119,6,.15)}
.progress-wrap{height:16px;background:var(--sand2);border:1px solid var(--border);border-radius:999px;overflow:hidden} html.dark .progress-wrap{background:#3a3632}
.progress-bar{height:100%;width:0;background:linear-gradient(90deg, var(--dune), #F59E0B, var(--oasis));transition:width .8s cubic-bezier(.22,1,.36,1);position:relative}
.progress-bar::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent);animation:shimmer 1.8s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.task{display:flex;gap:10px;align-items:center;padding:13px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);margin-bottom:10px;transition:.2s}
.task:hover{border-color:var(--dune);transform:translateX(2px)}
.sbtn{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--border);background:var(--sand2);cursor:pointer;font-weight:800;display:grid;place-items:center;transition:all .15s;touch-action:manipulation}
.sbtn:hover{transform:scale(1.08)} .sbtn:active{transform:scale(.85)}
.sbtn.active-y{background:var(--oasis);color:#fff;border-color:var(--oasis);box-shadow:0 4px 14px rgba(16,185,129,.4)}
.sbtn.active-h{background:#F59E0B;color:#fff;border-color:#F59E0B}
.sbtn.active-n{background:var(--fail);color:#fff;border-color:var(--fail)}
.delBtn{width:44px;height:44px;border-radius:12px;border:none;background:transparent;cursor:pointer;font-size:18px;display:grid;place-items:center;transition:.15s;touch-action:manipulation}
.delBtn:active{transform:scale(.85)}
.header{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:color-mix(in srgb, var(--sand) 88%, transparent);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.clock{font-weight:800;font-variant-numeric:tabular-nums;font-size:18px;color:var(--dune2)}
.hidden{display:none!important} .badge{font-size:12px;padding:6px 10px;border-radius:999px;background:var(--sand2);border:1px solid var(--border);font-weight:700}
.arch-day{border:1.5px solid var(--border);border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;background:var(--card);transition:.2s}
.arch-day:hover{border-color:var(--dune)} .arch-day:active{transform:scale(.98)}
.confetti{position:fixed;pointer-events:none;animation:pop .7s forwards;font-size:22px}
@keyframes pop{0%{transform:translateY(0) scale(.5);opacity:1}100%{transform:translateY(-90px) scale(1.4);opacity:0}}

:root{--d1:#E9B96E;--d2:#D9983F;--d3:#B8762A;--orb:#FDBA74;--thobe:#F5EBDD;--bisht:#4A2E17;--tent:#8A5A2B}
html.dark{--d1:#3A332E;--d2:#2B2623;--d3:#1E1A18;--orb:#FEF3C7;--thobe:#9AA3B5;--bisht:#1B1512;--tent:#171311}
.dune{display:none}
.scene{position:absolute;inset:0;width:100%;height:100%}
.sc-m{display:none}
@media(max-width:699px){.sc-d{display:none}.sc-m{display:block}}
#sand{position:absolute;inset:0;pointer-events:none}
.dn1{fill:var(--d1)}.dn2{fill:var(--d2)}.dn3{fill:var(--d3)}.tent{fill:var(--tent)}
.orb{fill:var(--orb);filter:drop-shadow(0 0 40px var(--orb))}
.thobe{fill:var(--thobe)}
.bisht path{fill:var(--bisht);stroke:#C9A24B;stroke-width:2}
.tail{transform-box:fill-box;transform-origin:0 0;animation:flap 2.4s ease-in-out infinite}
@keyframes flap{0%,100%{transform:skewY(calc(var(--wind,0)*1deg - 3deg))}50%{transform:skewY(calc(var(--wind,0)*1deg + 5deg))}}
.bisht{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewX(calc(var(--wind,0)*-.6deg - 2deg))}50%{transform:skewX(calc(var(--wind,0)*-.6deg + 3deg))}}
.card{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(6px)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--night);color:var(--sand);padding:10px 18px;border-radius:999px;font-weight:800;z-index:1000;max-width:90vw;text-align:center;animation:tin .3s,tout .4s 2.1s forwards}
@keyframes tin{from{opacity:0;transform:translate(-50%,16px)}}
@keyframes tout{to{opacity:0}}
.rain{position:fixed;top:-30px;pointer-events:none;z-index:1000;font-size:24px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}

@media(min-width:900px){
.container{max-width:1000px}
.hero{padding:30px 14px 22px}.hero h1{font-size:50px}.clock{font-size:28px}
#authCard{max-width:440px;margin:20px auto}
#app{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"tasks date" "tasks prog" "note arch" "note back";gap:16px;align-items:start}
#app>.card{margin-bottom:0}
#app>:nth-child(1){grid-area:date}#app>:nth-child(2){grid-area:prog}#app>:nth-child(3){grid-area:tasks}
#app>:nth-child(4){grid-area:note}#app>:nth-child(5){grid-area:arch}#app>:nth-child(6){grid-area:back}
#noteInput{min-height:180px}
}

:root{--d1a:#F6D79A;--d2a:#EBB766;--d3a:#D08A3A;--rim:#FFF1C9;--palm:#4E7A3A}
html.dark{--d1a:#4A423B;--d2a:#382F2A;--d3a:#29231F;--rim:#6D6258;--palm:#1F2B22}
.dn1{fill:url(#g1)}.dn2{fill:url(#g2)}.dn3{fill:url(#g3)}
.rd{fill:none;stroke:var(--rim);stroke-width:2.5;opacity:.55}
.crater{fill:#000;opacity:0}html.dark .crater{opacity:.09}
.cara{animation:walkD 120s linear infinite}.cara.cm{animation-name:walkM;animation-duration:90s}
@keyframes walkD{from{transform:translateX(-500px)}to{transform:translateX(1800px)}}
@keyframes walkM{from{transform:translateX(-260px)}to{transform:translateX(520px)}}
.bob{animation:bob 1.1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
svg{shape-rendering:geometricPrecision}
</style>
</head>

<div class="dune dune1" id="dune1"></div><div class="dune dune2" id="dune2"></div>
<canvas id="sand"></canvas></div>
<div class="header">
  <div style="display:flex;gap:10px;align-items:center"><div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--dune),var(--dune2));display:grid;place-items:center;color:#fff;font-family:'Amiri',serif;font-size:20px">س</div><div><div style="font-weight:800">يومياتي</div><div id="hdrDate" style="font-size:11px;color:var(--muted)">...</div></div></div>
  <div style="display:flex;gap:8px;align-items:center"><button id="darkBtn" type="button" class="btn btn-ghost btn-small">🌙</button><button id="logoutBtn" type="button" class="btn btn-ghost btn-small hidden">خروج</button></div>
</div>
<div class="hero">
  <h1>ليالي الصحراء</h1>
  <p>دون يومك تحت ضوء القمر ✨</p>
  <div style="margin-top:10px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap;align-items:center">
    <span id="liveClock" class="clock">--:--:--</span>
    <select id="tzSelect" class="input" style="width:auto;min-width:160px;padding:8px 12px"><option value="Asia/Riyadh">مكة - الرياض</option><option value="Asia/Dubai">دبي</option><option value="Asia/Tehran">طهران</option><option value="Africa/Cairo">القاهرة</option><option value="Europe/Istanbul">إسطنبول</option><option value="Europe/Berlin">برلين</option><option value="Europe/London">لندن</option><option value="America/New_York">نيويورك</option></select>
    <span id="userBadge" class="badge hidden"></span>
  </div>
</div>
<div class="container">
  <div id="authCard" class="card">
    <h2 style="margin:0;font-family:'Amiri',serif">مرحباً بضيف الصحراء 👋</h2><p style="color:var(--muted);font-size:13px">الجلسة تنتهي بإغلاق المتصفح</p>
    <input id="usernameInput" class="input" placeholder="اسم المستخدم sabah_123">
    <input id="passInput" type="password" class="input" placeholder="كلمة السر 6 أحرف+" style="margin-top:8px">
    <input id="pass2Input" type="password" class="input hidden" placeholder="تأكيد كلمة السر" style="margin-top:8px">
    <div style="display:flex;gap:8px;margin-top:12px"><button id="loginBtn" type="button" class="btn btn-primary" style="flex:1">دخول</button><button id="signupBtn" type="button" class="btn btn-ghost" style="flex:1">إنشاء حساب</button></div>
    <div id="authMsg" style="color:#DC2626;font-size:13px;margin-top:10px;min-height:18px"></div>
  </div>
  <div id="app" class="hidden">
    <div class="card" style="text-align:center"><div id="gregDate" style="font-weight:800"></div><div id="hijriDate" style="font-size:14px;color:var(--muted)"></div><div id="persianDate" style="font-size:14px;color:var(--muted)"></div><div id="moonPhase" style="font-size:22px;margin-top:6px"></div></div>

<script>
const firebaseConfig={apiKey:"AIzaSyBgSNPlPfXrlQw_mPwrr_WMokbhuudMu2k",authDomain:"sabahdaily-3691f.firebaseapp.com",projectId:"sabahdaily-3691f",storageBucket:"sabahdaily-3691f.firebasestorage.app",messagingSenderId:"645268785079",appId:"1:645268785079:web:2e22d9fc498393eda34a32"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(), db=firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
let ref=null,tz="Asia/Riyadh",days={},saveTimer=null,unsub=null;
const PRAYER=["صلاة الفجر في المسجد","صلاة الظهر في المسجد","صلاة العصر في المسجد","صلاة المغرب في المسجد","صلاة العشاء في المسجد"];
const glow=document.getElementById("cursorGlow"), d1=document.getElementById("dune1"), d2=document.getElementById("dune2"), starsEl=document.getElementById("stars");
for(let i=0;i<45;i++){const s=document.createElement("div");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*60+"%";s.style.animationDelay=Math.random()*3+"s";starsEl.appendChild(s)}

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function calc(tasks){if(!tasks||!tasks.length) return 0;let s=0;tasks.forEach(x=>{if(x.s==="y")s+=1;else if(x.s==="h")s+=.5});return Math.round(s/tasks.length*100)}
function vib(m){if(navigator.vibrate) navigator.vibrate(m)}
function confetti(el){vib(20);const r=el.getBoundingClientRect();for(let i=0;i<6;i++){const c=document.createElement("div");c.className="confetti";c.textContent=["🎉","✨","⭐"][i%3];c.style.left=(r.left+20)+"px";c.style.top=r.top+"px";c.style.transform="translate("+(Math.random()*60-30)+"px,0)";document.body.appendChild(c);setTimeout(()=>c.remove(),700)} el.animate([{transform:"scale(1)"},{transform:"scale(1.3)"},{transform:"scale(1)"}],{duration:250})}
setInterval(()=>{try{const n=new Date();document.getElementById("liveClock").textContent=new Intl.DateTimeFormat("ar",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false,timeZone:tz}).format(n);document.getElementById("hdrDate").textContent=new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(n);if(!days[todayKey()]&&ref){days[todayKey()]={note:"",tasks:[]};scheduleSave();renderAll()}}catch(e){}},1000);
function renderDates(){try{const n=new Date();document.getElementById("gregDate").textContent="📅 "+new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(n);document.getElementById("hijriDate").textContent="🌙 "+new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"long",day:"numeric"}).format(n);document.getElementById("persianDate").textContent="☀️ "+new Intl.DateTimeFormat("fa-IR-u-ca-persian-nu-latn",{year:"numeric",month:"long",day:"numeric"}).format(n);const LP=29.530588853*86400000,newMoon=Date.UTC(2000,0,6,18,14);let ph=((n-newMoon)%LP)/LP;if(ph<0)ph+=1;const idx=Math.floor(ph*8+.5)%8;const em=["🌑 محاق","🌒 هلال","🌓 تربيع","🌔 أحدب","🌕 بدر","🌖 أحدب","🌗 تربيع","🌘 هلال"][idx];document.getElementById("moonPhase").textContent=em;}catch(e){}}
const darkBtn=document.getElementById("darkBtn");
function setDark(v){document.documentElement.classList.toggle("dark",v);darkBtn.textContent=v?"☀️":"🌙";localStorage.setItem("sabah_dark",v?"1":"0")}
setDark(localStorage.getItem("sabah_dark")==="1");
darkBtn.onclick=function(){setDark(!document.documentElement.classList.contains("dark"))};
function toEmail(u){return u.trim().toLowerCase()+"@sabahdaily.app"}
function showMsg(t){document.getElementById("authMsg").textContent=t}
function mapErr(e){const c=e.code||"";if(c.includes("email-already-in-use"))return "الاسم مستخدم";if(c.includes("network-request-failed"))return "تأكد من الإنترنت";if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return "الاسم أو كلمة السر خطأ";return e.message||"حدث خطأ"}
document.getElementById("loginBtn").onclick=async function(){
  const u=document.getElementById("usernameInput").value.trim().toLowerCase();
  const p=document.getElementById("passInput").value;
  if(!/^[a-z0-9_]{3,20}$/.test(u)) return showMsg("الاسم 3-20 حرف إنجليزي صغير أو رقم أو _");
  if(p.length<6) return showMsg("كلمة السر 6 أحرف على الأقل");
  showMsg("جاري الدخول..."); try{await auth.signInWithEmailAndPassword(toEmail(u),p);showMsg("")}catch(e){showMsg(mapErr(e))}
};
document.getElementById("signupBtn").onclick=async function(){
  const u=document.getElementById("usernameInput").value.trim().toLowerCase();
  const p=document.getElementById("passInput").value;
  const p2=document.getElementById("pass2Input");
  if(p2.classList.contains("hidden")){p2.classList.remove("hidden");return showMsg("أعد كتابة كلمة السر واضغط إنشاء مرة أخرى")}
  if(!/^[a-z0-9_]{3,20}$/.test(u)) return showMsg("الاسم 3-20 حرف إنجليزي");
  if(p.length<6) return showMsg("كلمة السر 6+");
  if(p!==p2.value) return showMsg("كلمتا السر غير متطابقتين");
  showMsg("جاري الإنشاء..."); try{await auth.createUserWithEmailAndPassword(toEmail(u),p);showMsg("")}catch(e){showMsg(mapErr(e))}
};
document.getElementById("logoutBtn").onclick=function(){auth.signOut()};
auth.onAuthStateChanged(function(user){
  if(user){document.getElementById("authCard").classList.add("hidden");document.getElementById("app").classList.remove("hidden");document.getElementById("userBadge").classList.remove("hidden");document.getElementById("userBadge").textContent=user.email.split("@")[0];document.getElementById("logoutBtn").classList.remove("hidden");ref=db.collection("users").doc(user.uid);startSync()}
  else{document.getElementById("authCard").classList.remove("hidden");document.getElementById("app").classList.add("hidden");document.getElementById("userBadge").classList.add("hidden");document.getElementById("logoutBtn").classList.add("hidden");if(unsub)unsub()}
});
function startSync(){if(unsub)unsub();unsub=ref.onSnapshot(function(snap){if(snap.metadata.hasPendingWrites) return;const d=snap.data();if(d){tz=d.tz||"Asia/Riyadh";days=d.days||{}}else{tz="Asia/Riyadh";days={}}document.getElementById("tzSelect").value=tz;if(!days[todayKey()])days[todayKey()]={note:"",tasks:[]};renderAll()})}
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){if(!ref) return;const payload=JSON.parse(JSON.stringify({tz:tz,days:days}));ref.set(payload).catch(function(e){alert(e.message)})},400)}
document.getElementById("tzSelect").onchange=function(e){tz=e.target.value;scheduleSave();renderDates()};
function renderAll(){renderDates();renderTasks();renderNote();renderArchive()}
function renderNote(){const k=todayKey();const ta=document.getElementById("noteInput");if(document.activeElement!==ta) ta.value=(days[k]&&days[k].note)||""}
document.getElementById("noteInput").oninput=function(e){const k=todayKey();if(!days[k])days[k]={note:"",tasks:[]};days[k].note=e.target.value;scheduleSave()}
let lastP=-1;
function addTask(){const inp=document.getElementById("newTaskInput");const t=inp.value.trim();if(!t) return;const k=todayKey();if(!days[k])days[k]={note:"",tasks:[]};days[k].tasks.push({t:t});inp.value="";scheduleSave();renderAll()}
document.getElementById("addTaskBtn").onclick=addTask;
document.getElementById("newTaskInput").addEventListener("keydown",function(e){if(e.key==="Enter")addTask()});
function renderTasks(){
  const k=todayKey(),tasks=(days[k]&&days[k].tasks)||[];
  const sb=function(x,i,v,l,a){return '<button type="button" class="sbtn'+(x.s===v?' active-'+v:'')+'" data-i="'+i+'" data-s="'+v+'" aria-label="'+a+'">'+l+'</button>'};
  document.getElementById("tasksList").innerHTML=tasks.map(function(x,i){
    return '<div class="task"><span style="flex:1;word-break:break-word">'+esc(x.t)+'</span>'+sb(x,i,"n","✗","لم تتم")+sb(x,i,"h","½","نصف")+sb(x,i,"y","✓","تمت")+'<button type="button" class="delBtn" data-i="'+i+'" data-del="1" aria-label="حذف">🗑</button></div>'}).join("");
  document.getElementById("emptyTasks").classList.toggle("hidden",tasks.length>0);
  const p=calc(tasks);document.getElementById("progressBar").style.width=p+"%";document.getElementById("progressText").textContent=p+"%";if(p===100&&lastP>=0&&lastP<100&&window.celebrate)celebrate();lastP=p;
}
document.getElementById("tasksList").onclick=function(e){
  const b=e.target.closest("button");if(!b) return;
  const tasks=days[todayKey()].tasks,i=+b.dataset.i;
  if(b.dataset.del){tasks.splice(i,1)}
  else if(b.dataset.s){if(tasks[i].s===b.dataset.s)delete tasks[i].s;else{tasks[i].s=b.dataset.s;if(b.dataset.s==="y")confetti(b)}}
  scheduleSave();renderAll();
};
document.getElementById("prayerBtn").onclick=function(){
  const k=todayKey();if(!days[k])days[k]={note:"",tasks:[]};
  PRAYER.forEach(function(p){if(!days[k].tasks.some(function(x){return x.t===p}))days[k].tasks.push({t:p})});
  vib(15);scheduleSave();renderAll();
};
document.getElementById("carryBtn").onclick=function(){
  const y=days[yesterdayKey()],k=todayKey();
  if(!y||!y.tasks||!y.tasks.length) return alert("لا توجد مهام أمس");
  if(!days[k])days[k]={note:"",tasks:[]};
  let n=0;
  y.tasks.forEach(function(x){if(x.s!=="y"&&!days[k].tasks.some(function(z){return z.t===x.t})){days[k].tasks.push({t:x.t});n++}});
  alert(n?"تم ترحيل "+n+" مهمة":"لا يوجد ما يُرحَّل");
  scheduleSave();renderAll();
};
let archOpen=false;const openDays={};
const fmtG=function(d){return new Intl.DateTimeFormat("ar-u-ca-gregory-nu-latn",{weekday:"long",year:"numeric",month:"long",day:"numeric"}).format(d)};
const fmtH=function(d){return new Intl.DateTimeFormat("ar-SA-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"long",day:"numeric"}).format(d)};
function renderArchive(){
  const k=todayKey();
  const ks=Object.keys(days).filter(function(x){return x<k&&((days[x].tasks&&days[x].tasks.length)||days[x].note)}).sort().reverse();
  document.getElementById("archCount").textContent=ks.length;
  const box=document.getElementById("archiveList");box.classList.toggle("hidden",!archOpen);
  const ico={y:"✓",h:"½",n:"✗"};
  box.innerHTML=ks.length?ks.map(function(x){
    const d=days[x],dt=new Date(x+"T12:00:00");
    const more=openDays[x]?'<div style="margin-top:8px">'+(d.tasks||[]).map(function(t){return '<div>'+(ico[t.s]||"○")+' '+esc(t.t)+'</div>'}).join("")+(d.note?'<p style="color:var(--muted);white-space:pre-wrap">'+esc(d.note)+'</p>':'')+'</div>':'';
    return '<div class="arch-day" data-k="'+x+'"><div style="display:flex;justify-content:space-between"><b>'+fmtG(dt)+'</b><b style="color:var(--dune2)">'+calc(d.tasks)+'%</b></div><div style="font-size:12px;color:var(--muted)">'+fmtH(dt)+'</div>'+more+'</div>'
  }).join(""):'<div style="text-align:center;color:var(--muted)">الأرشيف فارغ، ينتقل إليه كل يوم تلقائيًا بعد انتهائه</div>';
}
document.getElementById("archToggle").onclick=function(){archOpen=!archOpen;renderArchive()};
document.getElementById("archiveList").onclick=function(e){const d=e.target.closest(".arch-day");if(!d)return;openDays[d.dataset.k]=!openDays[d.dataset.k];renderArchive()};
document.getElementById("exportBtn").onclick=function(){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify({days:days})],{type:"application/json"}));
  a.download="yawmiyati-"+todayKey()+".json";a.click();
};
document.getElementById("importFile").onchange=async function(e){
  try{const j=JSON.parse(await e.target.files[0].text());if(!j.days)throw 0;days=j.days;scheduleSave();renderAll();alert("تم الاستيراد")}
  catch(x){alert("الملف غير صالح")}
};

/* ===== الخلفية التفاعلية ===== */
(function(){
const cv=document.getElementById("sand"),cx=cv.getContext("2d");
const fine=matchMedia("(pointer:fine)").matches;
let W,H,mx=.5,my=.5,tx=.5,ty=.5,wind=0,gust=0,sy=0,P=[],mouse=null;
const PROV=["الصبر مفتاح الفرج","من جدّ وجد","قليلٌ دائم خيرٌ من كثيرٍ منقطع","في التأني السلامة","الوقت كالسيف","اطلبوا العلم من المهد إلى اللحد"];
function mk(x,y,burst){return{x:x==null?Math.random()*W:x,y:y==null?Math.random()*H:y,vx:burst?(Math.random()-.5)*7:.6,vy:burst?(Math.random()-.8)*4:(Math.random()-.5)*.3,r:1+Math.random()*2.2,l:burst?1:null}}
function size(){const r=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*r;cv.height=H*r;cv.style.width=W+"px";cv.style.height=H+"px";cx.setTransform(r,0,0,r,0,0);const n=W>899?70:35;while(P.filter(function(p){return p.l===null}).length<n)P.push(mk())}
function loop(){
  mx+=(tx-mx)*.06;my+=(ty-my)*.06;
  wind+=((mx-.5)*24+gust-wind)*.08;gust*=.94;
  document.documentElement.style.setProperty("--wind",wind.toFixed(2));
  document.querySelectorAll(".pl").forEach(function(g){const d=+g.dataset.p;g.style.transform="translate("+((mx-.5)*-d*40)+"px,"+((my-.5)*-d*20-sy*d*.06)+"px)"});
  cx.clearRect(0,0,W,H);
  cx.fillStyle=document.documentElement.classList.contains("dark")?"rgba(253,230,138,.6)":"rgba(180,100,20,.35)";
  for(let i=P.length-1;i>=0;i--){
    const p=P[i];
    if(mouse){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);if(d<110&&d>0){p.vx+=dx/d*.6;p.vy+=dy/d*.6}}
    p.vx+=(.6-p.vx)*.02;p.vy*=.98;p.x+=p.vx*.6+wind*.08;p.y+=p.vy;
    if(p.l!==null){p.l-=.02;if(p.l<=0){P.splice(i,1);continue}cx.globalAlpha=p.l}
    else{cx.globalAlpha=1;if(p.x>W+5)p.x=-5;if(p.x<-5)p.x=W+5;if(p.y>H)p.y=0;if(p.y<0)p.y=H}
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  }
  cx.globalAlpha=1;requestAnimationFrame(loop);
}
addEventListener("resize",size);size();loop();
addEventListener("mousemove",function(e){tx=e.clientX/W;ty=e.clientY/H;mouse={x:e.clientX,y:e.clientY}});
addEventListener("touchmove",function(e){const t=e.touches[0];mouse={x:t.clientX,y:t.clientY};tx=t.clientX/W;ty=t.clientY/H},{passive:true});
addEventListener("touchend",function(){mouse=null});
addEventListener("scroll",function(){sy=scrollY},{passive:true});
addEventListener("deviceorientation",function(e){if(e.gamma!=null){tx=.5+Math.max(-30,Math.min(30,e.gamma))/80;ty=.5+Math.max(-30,Math.min(30,(e.beta||45)-45))/120}});
window.toast=function(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(function(){d.remove()},2600)};
window.celebrate=function(){
  toast("ما شاء الله! أنجزت كل مهام اليوم 🎉");vib(40);gust=20;
  for(let i=0;i<28;i++){const s=document.createElement("div");s.className="rain";s.textContent=["🎉","✨","⭐","🌙"][i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(s);setTimeout(function(){s.remove()},3300)}
};
addEventListener("click",function(e){
  for(let i=0;i<14;i++)P.push(mk(e.clientX,e.clientY,true));
  if(e.target.closest("button,input,select,textarea,label,.card"))return;
  const m=[].slice.call(document.querySelectorAll(".hop")).find(function(g){return getComputedStyle(g.ownerSVGElement).display!=="none"});
  if(!m)return;
  const r=m.getBoundingClientRect();
  if(e.clientX>r.left-12&&e.clientX<r.right+12&&e.clientY>r.top-12&&e.clientY<r.bottom+12){
    m.animate([{transform:"translateY(0)"},{transform:"translateY(-16px)"},{transform:"translateY(0)"}],{duration:420});
    gust=16;vib(15);toast("🐪 "+PROV[Math.floor(Math.random()*PROV.length)]);
  }
});
if(fine)document.addEventListener("mousemove",function(e){
  const c=e.target.closest?e.target.closest(".card"):null;
  document.querySelectorAll(".card.tilt").forEach(function(x){if(x!==c){x.style.transform="";x.classList.remove("tilt")}});
  if(!c)return;
  const r=c.getBoundingClientRect();c.classList.add("tilt");
  c.style.transform="perspective(900px) rotateY("+(((e.clientX-r.left)/r.width-.5)*5)+"deg) rotateX("+(-((e.clientY-r.top)/r.height-.5)*4)+"deg)";
});
})();
</script>
